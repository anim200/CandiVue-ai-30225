# nginx inside the frontend container.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Do not reveal the nginx version in responses or error pages.
    server_tokens off;

    # API calls go to the backend container. For the browser, the app and the
    # API share one address, so no CORS is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Single-page app: any other address loads index.html, and React Router
    # shows the matching page (or "Page not found").
    location / {
        try_files $uri /index.html;
    }
}
