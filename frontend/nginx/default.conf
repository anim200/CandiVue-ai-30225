# nginx inside the frontend container: the HTTP server.
# Plain HTTP is the documented local-development exception (N10): Compose
# binds it to 127.0.0.1, so it is never reachable from the network.
# HTTPS is added by https.conf when a certificate is provided (see README).

# Interview links (/join/<token>) work like a password: hide the token in
# the access log (N22).
map $request_uri $masked_uri {
    ~^/join/  "/join/[hidden]";
    default   $request_uri;
}
log_format masked '$remote_addr [$time_local] "$request_method $masked_uri" '
                  '$status $body_bytes_sent';

server {
    listen 80;
    include /etc/nginx/app.conf;
}
