# HTTPS server. Only switched on by enable-https.sh when certs/cert.pem and
# certs/key.pem exist (created with mkcert, see README).

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Browsers remember to use HTTPS for this site (only sent over HTTPS).
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/app.conf;
}
