# Shared by the HTTP and the HTTPS server (included in both).

root /usr/share/nginx/html;

# Do not reveal the nginx version in responses or error pages.
server_tokens off;

# Log addresses with interview link tokens hidden (see default.conf, N22).
access_log /var/log/nginx/access.log masked;

# Security headers on every answer, including /api and error pages.
# - nosniff: the browser must not guess file types
# - no-referrer: addresses (e.g. interview links) are never sent to other sites
# - DENY / frame-ancestors: no other site may show CandiVue inside a frame
# - Permissions-Policy: only CandiVue itself may use camera and microphone
# - CSP: only CandiVue's own scripts, fonts and API; inline styles are needed
#   by Mantine. Extend it here when a feature needs another source.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# API calls go to the backend container. For the browser, the app and the
# API share one address, so no CORS is needed. Inside Docker's private
# network this hop is plain HTTP; it never leaves the machine.
location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Single-page app: any other address loads index.html, and React Router
# shows the matching page (or "Page not found").
location / {
    try_files $uri /index.html;
}
